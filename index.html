<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d25">
<meta name="description" content="A little pixel-art tulip love game made for Sharon.">
<title>For Sharon, with love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#090d28;--night:#101b48;--pink:#ff8db8;--rose:#f45d9d;--cream:#fff0d0;--mint:#8de0a5;--line:#40558b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink)}
body{min-height:100svh;display:grid;place-items:center;padding:18px;color:var(--cream);font-family:'VT323',monospace;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#27396d 0,#111a42 36%,#080d25 78%)}
button{font:inherit}
.game-shell{width:min(100%,470px);position:relative;padding:9px;background:linear-gradient(135deg,#62729a,#1a2449 20%,#070b20 60%,#4c5b85);box-shadow:0 0 0 2px #0a102d,0 0 0 4px #4d5d89,0 22px 70px #0009;border-radius:7px}
.game-shell:before{content:"";position:absolute;inset:4px;border:1px solid #a9b6d744;border-radius:4px;pointer-events:none;z-index:5}
.screen{height:min(820px,calc(100svh - 54px));min-height:600px;position:relative;overflow:hidden;background:#101b48;border:2px solid #05091d;isolation:isolate}
.sky{position:absolute;inset:0 0 30%;background:linear-gradient(180deg,#101735 0%,#18285f 48%,#304b89 100%);z-index:-4}
.sky:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 62%,#617ac533,transparent 52%)}
.pixel-stars{position:absolute;inset:0 0 27%;z-index:-3;pointer-events:none;background-image:
 radial-gradient(circle,#f9e8bd 0 1.2px,transparent 1.8px),radial-gradient(circle,#8fb9ed 0 1px,transparent 1.6px),radial-gradient(circle,#fff 0 1px,transparent 1.7px);
 background-size:73px 61px,113px 97px,157px 127px;background-position:9px 5px,28px 19px,52px 33px;opacity:.88}
.moon{position:absolute;right:12%;top:15%;width:58px;aspect-ratio:1;background:#f8e9b7;clip-path:polygon(18% 0,82% 0,82% 8%,92% 8%,92% 20%,100% 20%,100% 78%,91% 78%,91% 91%,78% 91%,78% 100%,20% 100%,20% 91%,8% 91%,8% 78%,0 78%,0 20%,8% 20%,8% 8%,18% 8%);box-shadow:0 0 32px #ffe4a54d;filter:drop-shadow(0 0 10px #ffe4a533)}
.moon:after{content:"";position:absolute;left:13px;top:13px;width:9px;height:9px;background:#e7d49e;box-shadow:17px 9px 0 #e7d49e,7px 25px 0 #e7d49e}
.topline{position:absolute;left:7%;right:7%;top:5%;display:flex;justify-content:space-between;align-items:center;color:#a9bde8;font-size:17px;letter-spacing:2px;text-transform:uppercase}
.topline span:last-child{color:#f3a3c4}
.title{position:absolute;top:12%;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(17px,4.9vw,25px);line-height:1.6;letter-spacing:1px;color:#ff9bc1;text-shadow:3px 3px 0 #763b79,0 0 20px #ff8db855;margin:0}
.subtitle{position:absolute;top:20.5%;left:8%;right:8%;text-align:center;font-size:23px;color:#cad7f3;letter-spacing:.6px}
.message{position:absolute;z-index:4;top:27%;left:5%;right:5%;min-height:48px;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.4vw,16px);line-height:1.85;color:#fff0d0;text-shadow:2px 2px #141b47;transition:opacity .18s}
.message.pop{animation:messagePop .32s ease-out}
@keyframes messagePop{0%{transform:translateY(7px);opacity:0}100%{transform:translateY(0);opacity:1}}
.landscape{position:absolute;left:0;right:0;bottom:15%;height:26%;z-index:-2;overflow:visible}
.mountain-back{position:absolute;inset:0 0 30%;background:#263c79;clip-path:polygon(0 72%,8% 62%,15% 67%,24% 31%,31% 48%,40% 9%,47% 41%,55% 30%,65% 67%,75% 22%,83% 56%,91% 39%,100% 62%,100% 100%,0 100%)}
.mountain-front{position:absolute;left:0;right:0;bottom:20%;height:65%;background:#192d62;clip-path:polygon(0 65%,11% 43%,18% 56%,31% 24%,43% 59%,55% 37%,67% 67%,80% 25%,88% 47%,100% 38%,100% 100%,0 100%)}
.ground{position:absolute;bottom:0;left:0;right:0;height:31%;background:#143e3e;border-top:4px solid #30705c;box-shadow:inset 0 9px #1d594c}
.ground:before{content:"";position:absolute;inset:5px 0 auto;height:8px;background:repeating-linear-gradient(90deg,#67b477 0 5px,transparent 5px 13px,#4b9968 13px 17px,transparent 17px 26px)}
.ground:after{content:"";position:absolute;left:0;right:0;bottom:0;height:15px;background:repeating-linear-gradient(90deg,#0a292f 0 9px,#10333a 9px 20px)}
.pixel-grass{position:absolute;bottom:28%;left:0;right:0;height:20px;background:repeating-linear-gradient(90deg,transparent 0 7px,#5fae70 7px 10px,transparent 10px 17px,#317c59 17px 19px,transparent 19px 27px);clip-path:polygon(0 100%,0 45%,4% 45%,4% 0,6% 0,6% 55%,10% 55%,10% 22%,12% 22%,12% 100%,16% 100%,16% 34%,18% 34%,18% 0,20% 0,20% 100%,24% 100%,24% 30%,26% 30%,26% 100%,30% 100%,30% 15%,32% 15%,32% 100%,38% 100%,38% 40%,40% 40%,40% 100%,45% 100%,45% 22%,47% 22%,47% 100%,53% 100%,53% 30%,55% 30%,55% 100%,60% 100%,60% 15%,62% 15%,62% 100%,68% 100%,68% 35%,70% 35%,70% 100%,75% 100%,75% 20%,77% 20%,77% 100%,82% 100%,82% 38%,84% 38%,84% 100%,90% 100%,90% 12%,92% 12%,92% 100%,97% 100%,97% 44%,99% 44%,99% 100%)}
.flower-stage{position:absolute;left:50%;bottom:18%;width:min(76%,300px);height:48%;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 12px 8px #070e2b66)}
.flower-stage svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
.stem{fill:#47a96b;stroke:#8ad58b;stroke-width:2;stroke-linejoin:miter}
.leaf{fill:#2e9b61;stroke:#78cb80;stroke-width:2;stroke-linejoin:miter}
.leaf-vein{fill:none;stroke:#9bdf98;stroke-width:2;opacity:.65}
.tulip-petal{stroke:#df4383;stroke-width:3.5;stroke-linejoin:miter;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .28s,transform .75s cubic-bezier(.18,.72,.23,1)}
.p1{fill:#f66b9d}.p2{fill:#ed568e}.p3{fill:#ff8db2}.p4{fill:#d94783}.p5{fill:#ffacc5}.p6{fill:#ec6b9d}
.tulip-petal.removed{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.78)}
.stamen{fill:#ffd788;stroke:#d89b55;stroke-width:1}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.heart{position:absolute;width:17px;height:17px;opacity:0;animation:heartRise var(--dur,2.8s) ease-out forwards;filter:drop-shadow(0 0 7px #ff719b66)}
.heart svg{width:100%;height:100%;shape-rendering:crispEdges}
@keyframes heartRise{0%{opacity:0;transform:translate(0,0) scale(.55)}12%{opacity:1}78%{opacity:.9}100%{opacity:0;transform:translate(var(--drift),-210px) scale(1.1)}}
.footer{position:absolute;bottom:4.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;z-index:6}
.pick{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;letter-spacing:.2px;color:#171b3d;background:linear-gradient(#ffd2df,#ff9fbe);border:0;border-bottom:4px solid #a94d76;padding:15px 17px;min-height:48px;box-shadow:0 0 0 2px #ffe5ed,0 5px 18px #f66b9d28;cursor:pointer;transition:transform .12s,filter .12s}
.pick:hover{filter:brightness(1.08)}.pick:active{transform:translateY(3px);border-bottom-width:1px}.pick:disabled{opacity:.75;cursor:default}
.reset{background:transparent;border:0;color:#b9c8ed;font-size:21px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:8px}
.instruction{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:17px;color:#a8bae2;letter-spacing:1px;z-index:6}
.final .message{top:23%;font-size:clamp(13px,3.8vw,17px);color:#ffd2e0}
.final .title{color:#ffe0b5;text-shadow:3px 3px #a94e7d,0 0 20px #ffd2ad66}
.final .flower-stage{animation:flowerGlow 2.8s ease-in-out infinite alternate}
.final .flower-base,.final #flowerDetails{opacity:0;transition:opacity .7s ease-out}
.final .tulip-petal{opacity:0;transition:opacity .65s ease-out,transform .75s cubic-bezier(.18,.72,.23,1)}
@keyframes flowerGlow{to{filter:drop-shadow(0 0 20px #fa83b888)}}
@media(max-height:700px){body{padding:8px}.game-shell{width:min(100%,420px)}.screen{min-height:550px;height:calc(100svh - 36px)}.topline{top:4%}.title{top:10%}.subtitle{top:18%}.message{top:25%}.flower-stage{height:45%;bottom:18%}.footer{bottom:3.5%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="game-shell" id="game">
 <section class="screen" id="screen" aria-label="Interactive pixel-art tulip">
  <div class="sky"></div><div class="pixel-stars"></div><div class="moon"></div>
  <div class="topline"><span>LOVE GARDEN</span><span>♡ SHARON</span></div>
  <h1 class="title" id="title">LOVES ME</h1>
  <div class="subtitle" id="subtitle">a little game, just for you</div>
  <div class="message" id="message" aria-live="polite">PICK A PETAL, MAKE A WISH</div>
  <div class="landscape" aria-hidden="true"><div class="mountain-back"></div><div class="mountain-front"></div><div class="ground"></div><div class="pixel-grass"></div></div>
  <div class="flower-stage">
   <svg viewBox="0 0 300 360" role="img" aria-label="A layered pink pixel-art tulip with ten petals" shape-rendering="crispEdges">
    <g id="foliage">
     <path d="M145 338H112V327H98V315H84V303H70V289H58V274H46V258H36V241H29V207H43V220H59V230H76V241H93V254H109V269H125V286H139V307H149V338Z" fill="#426db0" stroke="#31518d" stroke-width="2"/>
     <path d="M155 338H188V327H202V315H216V303H230V289H242V274H254V258H264V241H271V207H257V220H241V230H224V241H207V254H191V269H175V286H161V307H151V338Z" fill="#426db0" stroke="#31518d" stroke-width="2"/>
     <path d="M141 327H115V315H101V303H87V291H74V277H62V261H50V246H42V222H52V233H68V243H85V255H101V269H117V284H131V301H143V319Z" fill="#76d5ac" stroke="#65b9c2" stroke-width="3"/>
     <path d="M159 327H185V315H199V303H213V291H226V277H238V261H250V246H258V222H248V233H232V243H215V255H199V269H183V284H169V301H157V319Z" fill="#76d5ac" stroke="#65b9c2" stroke-width="3"/>
     <path d="M46 223H53V233H69V244H85V256H101V270H117V284H132V301" fill="none" stroke="#b7f39c" stroke-width="5"/>
     <path d="M254 223H247V233H231V244H215V256H199V270H183V284H168V301" fill="none" stroke="#b7f39c" stroke-width="5"/>
     <path d="M137 206H163V340H137Z" fill="#4979b9" stroke="#315794" stroke-width="3"/>
     <path d="M145 215H155V338H145Z" fill="#9de69c"/>
     <path d="M137 286H163V295H137Z" fill="#63bfc3"/>
    </g>
    <path class="flower-base" d="M91 218H78V207H67V193H59V117H51V96H43V51H83V62H103V75H119V55H137V43H165V55H183V64H200V75H218V62H237V51H257V96H249V117H241V193H233V207H222V218H205V226H95V218Z" fill="#d83c7b" stroke="#c93070" stroke-width="2"/>
    <g id="petalSet">
     <path class="tulip-petal p1" style="--tx:-60px;--ty:-65px;--r:-42deg" d="M79 199H68V185H61V111H55V91H49V59H78V70H96V83H111V103H121V131H114V162H105V185H94V199Z"/>
     <path class="tulip-petal p5" style="--tx:-35px;--ty:-90px;--r:-25deg" d="M104 180H93V165H85V118H92V96H108V81H127V93H139V116H132V142H123V166H115V180Z"/>
     <path class="tulip-petal p2" style="--tx:-18px;--ty:-100px;--r:-18deg" d="M124 169H112V155H105V126H112V103H128V88H145V101H155V124H148V149H139V169Z"/>
     <path class="tulip-petal p3" style="--tx:0px;--ty:-112px;--r:0deg" d="M139 155H128V135H121V95H130V73H143V58H166V70H179V91H186V123H178V145H166V159H151V155Z"/>
     <path class="tulip-petal p5" style="--tx:22px;--ty:-100px;--r:18deg" d="M168 165H158V148H151V123H158V97H173V80H191V92H203V111H197V144H188V165H179Z"/>
     <path class="tulip-petal p6" style="--tx:60px;--ty:-80px;--r:38deg" d="M190 197H179V183H172V160H181V134H190V107H205V90H223V76H242V62H251V94H245V116H238V185H230V199H216V207H198V197Z"/>
     <path class="tulip-petal p2" style="--tx:-68px;--ty:-8px;--r:-70deg" d="M94 190H83V177H77V153H84V136H98V124H113V140H121V164H114V184H105V198H94Z"/>
     <path class="tulip-petal p1" style="--tx:68px;--ty:-8px;--r:72deg" d="M205 191H194V179H186V158H194V137H208V125H224V138H232V160H225V181H217V196H205Z"/>
     <path class="tulip-petal p4" style="--tx:-8px;--ty:-80px;--r:-8deg" d="M119 184H108V171H116V153H130V142H146V151H158V142H174V154H184V173H176V188H163V199H137V194H119Z"/>
     <path class="tulip-petal p3" style="--tx:12px;--ty:-86px;--r:14deg" d="M143 164H132V151H139V130H151V116H164V127H173V145H166V164H156V174H145Z"/>
    </g>
    <g id="flowerDetails" aria-hidden="true">
     <path d="M136 60H151V72H163V85H174V99H164V91H153V79H136Z" fill="#ffd0d9" opacity=".85"/>
     <path d="M195 111H207V99H220V87H238V98H225V110H213V123H201Z" fill="#ffd0d9" opacity=".55"/>
     <path d="M82 134H95V145H107V156H94V147H82Z" fill="#ffb8ca" opacity=".65"/>
     <path d="M129 185H144V194H129Z" fill="#ffacc3" opacity=".8"/>
     <path d="M157 187H172V195H157Z" fill="#ffc3d3" opacity=".75"/>
    </g>
   </svg>
  </div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="footer"><button class="pick" id="pick">PICK A PETAL</button><button class="reset" id="reset">restart</button></div>
  <div class="instruction" id="instruction">one petal at a time</div>
 </section>
</main>
<script>
(()=>{
 const petalNodes=[...document.querySelectorAll('#petalSet .tulip-petal')];
 const message=document.getElementById('message'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle');
 const pick=document.getElementById('pick'),reset=document.getElementById('reset'),instruction=document.getElementById('instruction');
 const screen=document.getElementById('screen'),hearts=document.getElementById('hearts');
 const lines=['I LOVE YOU','I LOVE YOU NOT','I LOVE YOU','I LOVE YOU NOT','I LOVE YOU','I LOVE YOU NOT','I LOVE YOU','I LOVE YOU NOT','I LOVE YOU','I LOVE YOU'];
 let index=0,finished=false;
 function setMessage(text){message.classList.remove('pop');void message.offsetWidth;message.textContent=text;message.classList.add('pop')}
 function heart(x,y,delay){const wrap=document.createElement('span');wrap.className='heart';wrap.style.left=x+'%';wrap.style.top=y+'%';wrap.style.animationDelay=delay+'s';wrap.style.setProperty('--dur',(2.5+Math.random()*1.3)+'s');wrap.style.setProperty('--drift',(-30+Math.random()*60)+'px');wrap.innerHTML='<svg viewBox="0 0 16 16"><path fill="#ff719e" d="M2 2h4v2h4V2h4v2h2v5h-2v2h-2v2H8v2H6v-2H4v-2H2V9H0V4h2z"/><path fill="#ffc0d3" d="M3 3h3v2H3zM10 3h3v2h-3z"/></svg>';hearts.appendChild(wrap);setTimeout(()=>wrap.remove(),5000)}
 function finale(){finished=true;screen.classList.add('final');title.textContent='IT WAS ALWAYS YOU';subtitle.textContent='my favourite answer';message.innerHTML='I LOVE YOU SO MUCH<br><span style="color:#ffb2cc">SHARON</span>';message.classList.add('pop');pick.textContent='YOU ARE LOVED';pick.disabled=true;instruction.textContent='and that is never changing';for(let i=0;i<22;i++)heart(36+Math.random()*28,47+Math.random()*13,i*.12)}
 function choose(){if(finished||index>=petalNodes.length)return;petalNodes[index].classList.add('removed');setMessage(lines[index]);index++;if(index===petalNodes.length){instruction.textContent='just one last thing...';setTimeout(finale,850)}}
 function restart(){index=0;finished=false;screen.classList.remove('final');petalNodes.forEach(p=>p.classList.remove('removed'));hearts.innerHTML='';title.textContent='LOVES ME';subtitle.textContent='a little game, just for you';message.textContent='PICK A PETAL, MAKE A WISH';message.classList.remove('pop');pick.textContent='PICK A PETAL';pick.disabled=false;instruction.textContent='one petal at a time'}
 pick.addEventListener('click',choose);reset.addEventListener('click',restart);
})();
</script>
</body></html>
